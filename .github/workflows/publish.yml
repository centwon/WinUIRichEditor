name: Publish NuGet

# 태그(v*)를 푸시하거나 수동 실행하면 라이브러리를 pack 해서 nuget.org 에 게시한다.
#
# 인증은 NuGet Trusted Publishing (OIDC) — 저장소에 저장하는 장기 API 키가 없다.
# NuGet/login 액션이 GitHub OIDC 토큰을 nuget.org 의 단기(수명 짧은) API 키로 교환한다.
# 사전 설정: nuget.org > 계정 > Trusted Publishing 에서 아래를 매칭하는 정책을 만든다.
#   - Repository owner: centwon
#   - Repository:       WinUIRichEditor
#   - Workflow file:    publish.yml
#   - (Package: WinUIRichEditor / nuget.org 사용자명 kanu)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.8.0). Overrides the tag.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # OIDC 토큰 발급에 필요 (Trusted Publishing)

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'No version resolved.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publishing version $v"

      - name: Pack
        run: >
          dotnet pack src/WinUIRichEditor/WinUIRichEditor.csproj
          -c Release -p:Platform=x64
          -p:Version=${{ steps.ver.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o ${{ github.workspace }}/artifacts

      # OIDC → 단기 API 키. user 는 nuget.org 사용자명(정책 소유자)으로 맞춰야 한다.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: kanu

      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ${{ github.workspace }}/artifacts/*
